name: KVM runner preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Inspect virtualization capability
        run: |
          set -euo pipefail
          uname -a
          lscpu
          ls -l /dev/kvm
      - name: Validate Incus installation and VM driver
        run: bash .github/scripts/setup_kvm_runner.sh
      - name: Inspect service after installation
        if: always()
        run: |
          sudo systemctl --no-pager --full status incus.service || true
          sudo journalctl --no-pager -u incus.service -n 100 || true
          if command -v incus >/dev/null 2>&1; then
            sudo incus version || true
          fi
